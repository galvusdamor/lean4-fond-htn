name = "FondHtn"
defaultTargets = ["FondHtn"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

# Vendored copy of the HTN formalisation (deps/, read-only, see deps/README.md):
# on ComplexityTheory.
[[require]]
name = "HtnComplexity"
path = "deps/htn-complexity"

[[lean_lib]]
name = "FondHtn"
globs = ["FondHtn", "FondHtn.+"]
