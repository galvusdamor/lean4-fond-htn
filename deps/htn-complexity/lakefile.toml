name = "HtnComplexity"
defaultTargets = ["HtnComplexity"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.28.0"

# The repository below this one.  For a local checkout of all four repositories side by side:
[[require]]
name = "HtnPlanning"
path = "../htn-planning"

# Once the repositories are on GitHub, replace the block above by:
# [[require]]
# name = "HtnPlanning"
# git = "https://github.com/<owner>/htn-planning.git"
# rev = "main"

[[lean_lib]]
name = "HtnComplexity"
globs = ["HtnComplexity", "HtnComplexity.+"]
